<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DS103 – Web ôn tập Generative AI</title>
<style>
:root{--bg:#eef4fb;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#dbe5f0;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706;--violet:#7c3aed;--soft:#f8fafc}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(135deg,#f8fafc,#eaf3ff);color:var(--ink)}
button,select,input,textarea{font:inherit}.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;overflow:auto;padding:14px 16px 24px;background:rgba(255,255,255,.94);border-right:1px solid var(--line);display:flex;flex-direction:column}
/*
  THỨ TỰ SIDEBAR BẮT BUỘC:
  1) Tên web; 2) DANH SÁCH NÚT CÂU HỎI; 3) thống kê; 4) lọc/tìm/thi thử.
  Không được đưa bảng thống kê hoặc bộ lọc lên trước #nav.
*/
.side>.brand{order:0}.side>#nav{order:1}.side>.stats{order:2}.side>.control{order:3}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:14px}.mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:950;background:linear-gradient(135deg,var(--blue),#22c55e)}.brand h1{font-size:20px;line-height:1.08;margin:0}.brand p{font-size:12px;color:var(--muted);margin:4px 0 0}
.stats{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin:12px 0;box-shadow:0 10px 28px rgba(15,23,42,.06)}.statsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--soft);border:1px solid #e8eef5;border-radius:12px;padding:10px}.num{font-size:22px;font-weight:950}.cap{font-size:11px;color:var(--muted);margin-top:3px}.progress{height:9px;background:#e8eef6;border-radius:99px;overflow:hidden;margin-top:10px}.progress>span{height:100%;display:block;background:linear-gradient(90deg,var(--blue),#22c55e);width:0}.tiny{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.45}
.control{margin:12px 0}.control label{display:block;font-size:12px;font-weight:900;color:#475569;margin-bottom:6px}select,input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}select:focus,input:focus,textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 4px #dbeafe}
.quick{display:flex;flex-wrap:wrap;gap:6px}.mini,.btn,.ghost,.goodBtn,.badBtn,.violetBtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:850;cursor:pointer;transition:.14s}.mini:hover,.btn:hover,.ghost:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,23,42,.08)}.mini.active{background:var(--blue);color:#fff;border-color:var(--blue)}.mini.exam{background:#eff6ff;color:#1d4ed8}.goodBtn{background:#dcfce7;border-color:#86efac;color:#166534}.badBtn{background:#fee2e2;border-color:#fecaca;color:#991b1b}.violetBtn{background:#f3e8ff;border-color:#d8b4fe;color:#6b21a8}
.partTitle{font-size:11px;font-weight:950;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 7px}.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qbtn{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:900;cursor:pointer;position:relative}.qbtn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.qbtn.good{background:#dcfce7;color:#166534;border-color:#86efac}.qbtn.bad{background:#fee2e2;color:#991b1b;border-color:#fecaca}.qbtn.learned{background:#e0f2fe;color:#075985;border-color:#7dd3fc}.qbtn.essay{border-style:dashed;color:#6b21a8}.qbtn.star:after{content:'★';position:absolute;right:3px;top:1px;font-size:9px;color:#f59e0b}
.main{padding:14px 24px 32px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:16px;padding:9px 11px;margin-bottom:10px;box-shadow:0 10px 28px rgba(15,23,42,.05)}.topTitle{display:flex;align-items:center;gap:8px}.topTitle .mark{width:35px;height:35px;border-radius:11px;font-size:12px}.topTitle b{font-size:18px}.topTitle small{display:block;color:var(--muted);font-weight:600;margin-top:2px}.topActions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.btn{padding:8px 10px;font-size:12px}.btn.primary{background:#0f172a;color:#fff;border-color:#0f172a}.btn.answerOn{background:#16a34a;color:#fff;border-color:#16a34a}.btn.danger{background:#fff1f2;color:#be123c;border-color:#fecdd3}.btn.starClear{background:#fef3c7;color:#92400e;border-color:#fde68a}
.examStatus{display:none;border:1px solid #93c5fd;background:#eff6ff;color:#1e3a8a;border-radius:14px;padding:10px 13px;margin-bottom:10px;font-weight:800}.examStatus.show{display:flex;justify-content:space-between;gap:10px;align-items:center}.timer{font-variant-numeric:tabular-nums;background:#0f172a;color:#fff;border-radius:999px;padding:6px 10px}
.answerMap{display:none;border:1px solid #86efac;background:#f0fdf4;border-radius:16px;padding:12px;margin-bottom:10px}.answerMap.show{display:block}.answerMapHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px;color:#14532d}.answerMapGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}.ansChip{border:1px solid #86efac;background:#dcfce7;color:#14532d;border-radius:9px;padding:7px 8px;font-weight:950;cursor:pointer;display:flex;justify-content:space-between}
.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:18px;padding:22px;box-shadow:0 16px 40px rgba(15,23,42,.08);min-height:540px}.card.short{border-left-color:#0891b2}.card.essay{border-left-color:var(--violet)}.head{display:flex;justify-content:space-between;gap:12px;padding-bottom:11px;border-bottom:1px solid var(--line)}.qid{font-size:20px;font-weight:950;color:var(--blue)}.card.short .qid{color:#0e7490}.card.essay .qid{color:var(--violet)}.muted{font-size:12px;color:var(--muted);margin-top:3px}.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.tag{font-size:11px;font-weight:850;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px}.tag.short{background:#ecfeff;color:#0e7490}.tag.essay{background:#faf5ff;color:#6b21a8}.qtext{font-size:21px;line-height:1.4;font-weight:900;margin:18px 0 12px}.studyTip{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:10px 12px;color:#475569;font-size:13px;line-height:1.5;margin:10px 0}
.options{display:grid;gap:10px;margin-top:14px}.option{display:flex;align-items:flex-start;gap:12px;text-align:left;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px 14px;cursor:pointer;font-size:15px}.option:hover{border-color:#93c5fd;background:#f8fbff}.option .letter{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:#f1f5f9;display:grid;place-items:center;font-weight:950}.option .otext{line-height:1.45;font-weight:650}.option.selected{border-color:var(--blue);background:#eff6ff}.option.correct{border-color:#22c55e;background:#dcfce7}.option.wrong{border-color:#ef4444;background:#fee2e2}
.feedback,.answerBox,.outlineBox{border-radius:14px;padding:13px 15px;margin-top:13px;border:1px solid var(--line);line-height:1.55}.feedback.good{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}.feedback.bad{background:#fff1f2;border-color:#fecdd3;color:#7f1d1d}.feedback.neutral{background:#f8fafc}.explain{margin-top:6px;color:#075985}.answerBox{background:linear-gradient(180deg,#f0f9ff,#fff);border-color:#bae6fd}.outlineBox{background:linear-gradient(180deg,#faf5ff,#fff);border-color:#d8b4fe}.boxLabel{text-transform:uppercase;font-size:11px;letter-spacing:.06em;font-weight:950;color:#0369a1;margin-bottom:7px}.outlineBox .boxLabel{color:#7e22ce}.answerMain{font-size:16px;font-weight:720;white-space:pre-wrap}.keywords{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.kw{background:#fef3c7;border:1px solid #fde68a;color:#92400e;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900}
textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:13px;padding:12px 13px;outline:none;background:#fff;line-height:1.55}.essay textarea{min-height:230px}.subActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}.actionGroup{display:flex;gap:7px;flex-wrap:wrap}.source{font-size:11px;color:#94a3b8;margin-top:8px}.empty{text-align:center;color:var(--muted);padding:50px 20px}
@media print{.side,.topbar,.examStatus,.answerMap,.actions,.subActions{display:none!important}.app{display:block}.main{padding:0}.card{box-shadow:none;border:0;min-height:0}.answerBox,.outlineBox{display:block!important}body{background:#fff}}
/*
  QUY TẮC BỐ CỤC QUAN TRỌNG CHO CÁC LẦN SỬA SAU:
  - Trên màn hình hẹp/điện thoại, PHẦN CÂU HỎI (.main) luôn phải nằm TRÊN ĐẦU.
  - Danh sách số câu và bộ lọc (.side) phải nằm SAU phần câu hỏi.
  - Không được để người học phải cuộn qua toàn bộ danh sách số câu mới nhìn thấy câu hỏi.
*/
@media(max-width:980px){.app{grid-template-columns:1fr}.main{grid-column:1;grid-row:1;padding:10px 12px}.side{grid-column:1;grid-row:2;position:relative;height:auto;border-right:0;border-top:1px solid var(--line)}.qgrid{grid-template-columns:repeat(8,1fr)}.topbar{align-items:flex-start;flex-direction:column}.topActions{justify-content:flex-start}.card{padding:16px;min-height:480px}.qtext{font-size:19px}}
@media(max-width:560px){.qgrid{grid-template-columns:repeat(6,1fr)}.topTitle small{display:none}.card{border-left-width:4px}.actions{flex-direction:column}.actionGroup{width:100%}.actionGroup button{flex:1}.answerMapGrid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<div class="app">
<!--
  LƯU Ý KHI CHỈNH FILE NÀY: DOM để sidebar trước nhằm giữ bố cục desktop,
  nhưng CSS mobile bắt buộc đổi thứ tự hiển thị: .main ở hàng 1, .side ở hàng 2.
  CÂU HỎI PHẢI HIỆN TRƯỚC DANH SÁCH SỐ CÂU TRÊN MÀN HÌNH HẸP.
-->
<aside class="side">
  <!--
    QUY TẮC CỐ ĐỊNH: danh sách nút câu hỏi (#nav) phải nằm ngay dưới tên web
    và PHẢI nằm trên bảng thống kê, lọc câu, chủ đề, tìm nhanh và thi thử.
    Không được chuyển #nav xuống cuối sidebar ở các lần chỉnh sửa sau.
  -->
  <div class="brand"><div class="mark">AI</div><div><h1>DS103 Quiz</h1><p>Generative AI · Web ôn tập</p></div></div>
  <div id="nav"></div>
  <div class="stats">
    <div class="statsgrid">
      <div class="stat"><div id="score" class="num">0</div><div class="cap">Đúng / đã thuộc</div></div>
      <div class="stat"><div id="answered" class="num">0/57</div><div class="cap">Đã làm</div></div>
      <div class="stat"><div id="percent" class="num">0%</div><div class="cap">Tiến độ</div></div>
      <div class="stat"><div id="currentNum" class="num">1</div><div class="cap">Câu hiện tại</div></div>
    </div>
    <div class="progress"><span id="bar"></span></div>
    <div class="tiny">Trắc nghiệm chấm tự động. Trả lời ngắn và tự luận tự đánh dấu sau khi so với đáp án/gợi ý.</div>
  </div>
  <div class="control"><label>Lọc câu</label><select id="filter">
    <option value="all">Tất cả câu</option><option value="mcq">Chỉ trắc nghiệm</option><option value="short">Chỉ trả lời ngắn</option><option value="essay">Chỉ tự luận</option><option value="wrong">Sai / chưa thuộc</option><option value="learned">Đúng / đã thuộc</option><option value="starred">Câu đã gắn sao</option>
  </select></div>
  <div class="control"><label>Chủ đề</label><select id="topic"><option value="all">Tất cả chủ đề</option></select></div>
  <div class="control"><label>Tìm nhanh</label><input id="search" placeholder="hallucination, prompt, SWOT..."></div>
  <div class="control"><label>Ôn nhanh</label><div class="quick"><button class="mini" id="wrongQuick">Sai/chưa thuộc</button><button class="mini" id="shortQuick">Trả lời ngắn</button><button class="mini" id="starQuick">⭐ Câu sao</button></div></div>
  <div class="control"><label>Thi thử trắc nghiệm</label><div class="quick"><button class="mini exam" data-exam="10">10 câu</button><button class="mini exam" data-exam="20">20 câu</button><button class="mini exam" data-exam="40">40 câu</button></div></div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="topTitle"><div class="mark">DS</div><div><b>Đề cương ôn tập DS103</b><small>40 trắc nghiệm · 12 trả lời ngắn · 5 ý tự luận</small></div></div>
    <div class="topActions"><button class="btn" id="toggleAnswers">Bật đáp án đúng</button><button class="btn" id="randomBtn">Random câu</button><button class="btn" id="printBtn">In / Xuất PDF</button><button class="btn danger" id="resetBtn">Xóa tiến độ</button><button class="btn starClear" id="clearStarsBtn">⭐ Xóa câu sao</button></div>
  </div>
  <div id="examStatus" class="examStatus"></div>
  <div id="answerMap" class="answerMap"></div>
  <section id="card" class="card"></section>
</main>
</div>
<script id="question-data" type="application/json">[{"id":"m1","display":"1","part":"Phần 1","type":"mcq","question":"Generative AI có khả năng tạo ra loại nội dung nào sau đây?","options":[{"label":"A","text":"Chỉ văn bản"},{"label":"B","text":"Chỉ hình ảnh"},{"label":"C","text":"Chỉ mã nguồn"},{"label":"D","text":"Văn bản, hình ảnh, âm thanh và nhiều loại nội dung khác"}],"correct":"D","explanation":"Generative AI có thể tạo nhiều loại nội dung mới, không chỉ giới hạn ở văn bản, hình ảnh hay mã nguồn.","topic":"Nền tảng GenAI & LLM","source":"Đề cương ôn tập DS103"},{"id":"m2","display":"2","part":"Phần 1","type":"mcq","question":"Trong mô hình I-P-O, thành phần nào thực hiện việc xử lý Prompt để tạo ra kết quả?","options":[{"label":"A","text":"Input"},{"label":"B","text":"Processing"},{"label":"C","text":"Output"},{"label":"D","text":"Context"}],"correct":"B","explanation":"Trong I–P–O, Processing là bước mô hình xử lý Prompt và dữ liệu đầu vào để sinh kết quả.","topic":"Nền tảng GenAI & LLM","source":"Đề cương ôn tập DS103"},{"id":"m3","display":"3","part":"Phần 1","type":"mcq","question":"Đặc điểm nổi bật của Large Language Model (LLM) là gì?","options":[{"label":"A","text":"Chỉ xử lý dữ liệu dạng số"},{"label":"B","text":"Chỉ hoạt động khi có kết nối Internet"},{"label":"C","text":"Được huấn luyện trên lượng dữ liệu rất lớn để hiểu và tạo ngôn ngữ tự nhiên"},{"label":"D","text":"Chỉ có khả năng dịch ngôn ngữ"}],"correct":"C","explanation":"LLM được huấn luyện trên tập dữ liệu ngôn ngữ rất lớn nhằm học quy luật và tạo ngôn ngữ tự nhiên.","topic":"Nền tảng GenAI & LLM","source":"Đề cương ôn tập DS103"},{"id":"m4","display":"4","part":"Phần 1","type":"mcq","question":"Thành tố nào trong Prompt xác định loại sản phẩm mà AI cần tạo ra?","options":[{"label":"A","text":"Role"},{"label":"B","text":"Product"},{"label":"C","text":"Attribute"},{"label":"D","text":"Context"}],"correct":"B","explanation":"Product mô tả sản phẩm AI cần tạo ra, chẳng hạn bài viết, kế hoạch, bảng phân tích hoặc đoạn mã.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m5","display":"5","part":"Phần 1","type":"mcq","question":"Ví dụ nào sau đây thể hiện thành tố Role trong Prompt?","options":[{"label":"A","text":"Viết dưới dạng bảng"},{"label":"B","text":"Đóng vai chuyên gia marketing"},{"label":"C","text":"Sử dụng giọng văn thân thiện"},{"label":"D","text":"Trình bày bằng JSON"}],"correct":"B","explanation":"“Đóng vai chuyên gia…” gán vai trò/chuyên môn cho AI nên thuộc thành tố Role.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m6","display":"6","part":"Phần 1","type":"mcq","question":"Trong Prompt, thành tố nào giúp AI hiểu rõ dữ liệu hoặc tình huống cụ thể?","options":[{"label":"A","text":"Attribute"},{"label":"B","text":"Product"},{"label":"C","text":"Context"},{"label":"D","text":"Format"}],"correct":"C","explanation":"Context cung cấp dữ liệu nền và tình huống cụ thể để AI hiểu đúng phạm vi yêu cầu.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m7","display":"7","part":"Phần 1","type":"mcq","question":"Kỹ thuật Zero-shot Prompting là kỹ thuật trong đó người dùng:","options":[{"label":"A","text":"Đưa ra yêu cầu mà không cung cấp ví dụ mẫu cho AI"},{"label":"B","text":"Luôn cung cấp ít nhất ba ví dụ mẫu cho AI"},{"label":"C","text":"Chỉ sử dụng Prompt cho dữ liệu dạng số"},{"label":"D","text":"Chỉ áp dụng cho các bài toán phân loại"}],"correct":"A","explanation":"Zero-shot là giao nhiệm vụ trực tiếp mà không đưa ví dụ mẫu.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m8","display":"8","part":"Phần 1","type":"mcq","question":"Trong kỹ thuật Few-shot Prompting, người dùng thường cung cấp thêm thông tin nào cho AI?","options":[{"label":"A","text":"Dữ liệu huấn luyện mới"},{"label":"B","text":"Một số ví dụ mẫu minh họa cho nhiệm vụ cần thực hiện"},{"label":"C","text":"Nhiều Prompt liên tiếp"},{"label":"D","text":"Các bước suy luận chi tiết của AI"}],"correct":"B","explanation":"Few-shot cung cấp một vài ví dụ để AI nhận ra mẫu và cách thực hiện nhiệm vụ.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m9","display":"9","part":"Phần 1","type":"mcq","question":"Kỹ thuật Chain-of-Thought giúp cải thiện điều gì?","options":[{"label":"A","text":"Khả năng suy luận từng bước"},{"label":"B","text":"Tốc độ phản hồi"},{"label":"C","text":"Khả năng tạo hình ảnh"},{"label":"D","text":"Khả năng lưu trữ dữ liệu"}],"correct":"A","explanation":"Chain-of-Thought hỗ trợ tổ chức quá trình suy luận theo từng bước.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m10","display":"10","part":"Phần 1","type":"mcq","question":"Kỹ thuật Prompt Chaining phù hợp nhất với tình huống nào?","options":[{"label":"A","text":"Tạo một câu trả lời ngắn"},{"label":"B","text":"Giải quyết bài toán phức tạp gồm nhiều bước"},{"label":"C","text":"Dịch văn bản đơn giản"},{"label":"D","text":"Tạo hình ảnh từ mô tả"}],"correct":"B","explanation":"Prompt Chaining chia một nhiệm vụ phức tạp thành nhiều Prompt nối tiếp nhau.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m11","display":"11","part":"Phần 1","type":"mcq","question":"Theo Bloom's Taxonomy, hành động “tóm tắt văn bản thành các ý chính” thuộc cấp độ nào?","options":[{"label":"A","text":"Understand"},{"label":"B","text":"Remember"},{"label":"C","text":"Apply"},{"label":"D","text":"Evaluate"}],"correct":"A","explanation":"Tóm tắt đòi hỏi hiểu nội dung rồi diễn đạt lại ý chính, thuộc mức Understand.","topic":"Thinking Framework","source":"Đề cương ôn tập DS103"},{"id":"m12","display":"12","part":"Phần 1","type":"mcq","question":"Trong SCAMPER, chữ S đại diện cho hành động nào?","options":[{"label":"A","text":"Substitute"},{"label":"B","text":"Simplify"},{"label":"C","text":"Solve"},{"label":"D","text":"Support"}],"correct":"A","explanation":"Trong SCAMPER, S là Substitute – thay thế một yếu tố bằng yếu tố khác.","topic":"Thinking Framework","source":"Đề cương ôn tập DS103"},{"id":"m13","display":"13","part":"Phần 1","type":"mcq","question":"Framework SWOT thường được sử dụng để:","options":[{"label":"A","text":"Tạo ý tưởng sáng tạo"},{"label":"B","text":"Phân tích điểm mạnh, điểm yếu, cơ hội và thách thức"},{"label":"C","text":"Đánh giá mức độ hiểu bài"},{"label":"D","text":"Tóm tắt tài liệu"}],"correct":"B","explanation":"SWOT phân tích Strengths, Weaknesses, Opportunities và Threats.","topic":"Thinking Framework","source":"Đề cương ôn tập DS103"},{"id":"m14","display":"14","part":"Phần 1","type":"mcq","question":"Lợi ích nào sau đây của Generative AI có thể hỗ trợ sinh viên học tập hiệu quả hơn?","options":[{"label":"A","text":"Thay thế hoàn toàn việc tự học"},{"label":"B","text":"Cá nhân hóa nội dung học tập"},{"label":"C","text":"Loại bỏ hoàn toàn sai sót"},{"label":"D","text":"Không cần kiểm tra thông tin"}],"correct":"B","explanation":"GenAI có thể điều chỉnh giải thích, bài tập và tốc độ học theo nhu cầu từng người học.","topic":"AI trong giáo dục & trách nhiệm","source":"Đề cương ôn tập DS103"},{"id":"m15","display":"15","part":"Phần 1","type":"mcq","question":"Khi sử dụng Generative AI trong học tập, bước nào giúp giảm nguy cơ Hallucination?","options":[{"label":"A","text":"Tăng độ dài Prompt"},{"label":"B","text":"Chỉ sử dụng một công cụ AI"},{"label":"C","text":"Yêu cầu AI trả lời nhanh hơn"},{"label":"D","text":"Kiểm tra và đối chiếu thông tin từ nhiều nguồn"}],"correct":"D","explanation":"Đối chiếu nhiều nguồn đáng tin cậy là cách quan trọng để phát hiện thông tin AI bịa hoặc sai.","topic":"AI trong giáo dục & trách nhiệm","source":"Đề cương ôn tập DS103"},{"id":"m16","display":"16","part":"Phần 1","type":"mcq","question":"Công cụ nào phù hợp nhất để tạo slide trình bày tự động từ nội dung văn bản?","options":[{"label":"A","text":"Perplexity"},{"label":"B","text":"Notion AI"},{"label":"C","text":"Gamma AI"},{"label":"D","text":"Quizlet AI"}],"correct":"C","explanation":"Gamma AI chuyên hỗ trợ tạo bài trình chiếu tự động từ nội dung văn bản.","topic":"AI trong giáo dục & trách nhiệm","source":"Đề cương ôn tập DS103"},{"id":"m17","display":"17","part":"Phần 1","type":"mcq","question":"Công cụ nào thường được sử dụng để hỗ trợ viết và chỉnh sửa nội dung học thuật?","options":[{"label":"A","text":"Google Calendar AI"},{"label":"B","text":"Quizlet AI"},{"label":"C","text":"Canva AI"},{"label":"D","text":"ChatGPT"}],"correct":"D","explanation":"ChatGPT thường được dùng để lên ý, viết nháp, giải thích và chỉnh sửa nội dung học thuật.","topic":"AI trong giáo dục & trách nhiệm","source":"Đề cương ôn tập DS103"},{"id":"m18","display":"18","part":"Phần 1","type":"mcq","question":"Mục tiêu chính của việc Fact-check khi làm việc với AI là gì?","options":[{"label":"A","text":"Tăng số lượng nguồn tham khảo"},{"label":"B","text":"Giảm thời gian phản hồi"},{"label":"C","text":"Tạo nội dung sáng tạo hơn"},{"label":"D","text":"Xác minh độ chính xác của thông tin"}],"correct":"D","explanation":"Fact-check nhằm xác minh tính đúng đắn của thông tin trước khi sử dụng.","topic":"AI trong giáo dục & trách nhiệm","source":"Đề cương ôn tập DS103"},{"id":"m19","display":"19","part":"Phần 1","type":"mcq","question":"Trong workflow AI cá nhân, việc lưu trữ Prompt và Output nhằm mục đích gì?","options":[{"label":"A","text":"Tăng tốc độ Internet"},{"label":"B","text":"Tái sử dụng và cải thiện quy trình làm việc"},{"label":"C","text":"Giảm số lượng công cụ AI"},{"label":"D","text":"Loại bỏ hoàn toàn việc chỉnh sửa"}],"correct":"B","explanation":"Lưu Prompt và Output giúp tái sử dụng mẫu tốt, so sánh kết quả và cải tiến workflow.","topic":"AI trong giáo dục & trách nhiệm","source":"Đề cương ôn tập DS103"},{"id":"m20","display":"20","part":"Phần 1","type":"mcq","question":"Theo nguyên tắc sử dụng AI có trách nhiệm, sinh viên nên:","options":[{"label":"A","text":"Sao chép toàn bộ nội dung AI tạo ra"},{"label":"B","text":"Không cần trích dẫn nếu đã chỉnh sửa nội dung"},{"label":"C"," planation":"Transformer là kiến trúc mô hình, không phải thành tố dùng để viết Prompt.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m25","display":"25","part":"Phần 1","type":"mcq","question":"Few-shot prompting nghĩa là:","options":[{"label":"A","text":"Không đưa ví dụ nào"},{"label":"B","text":"Cung cấp một vài ví dụ"},{"label":"C","text":"Cung cấp hàng trăm ví dụ"},{"label":"D","text":"Yêu cầu giải thích logic"}],"correct":"B","explanation":"Few-shot nghĩa là đưa một vài ví dụ minh họa cho nhiệm vụ.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m26","display":"26","part":"Phần 1","type":"mcq","question":"Kỹ thuật trình bày suy luận chi tiết:","options":[{"label":"A","text":"Zero-shot"},{"label":"B","text":"Few-shot"},{"label":"C","text":"Chain-of-Thought"},{"label":"D","text":"Self-Consistency"}],"correct":"C","explanation":"Chain-of-Thought là kỹ thuật yêu cầu hoặc khuyến khích trình bày quá trình suy luận theo bước.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m27","display":"27","part":"Phần 1","type":"mcq","question":"Kỹ thuật AI tự xem lại và cải thiện đáp án:","options":[{"label":"A","text":"Retrieval"},{"label":"B","text":"Reflexion"},{"label":"C","text":"Chain-of-Thought"},{"label":"D","text":"Meta Prompt"}],"correct":"B","explanation":"Reflexion cho AI xem lại kết quả, nhận ra điểm yếu và tạo phiên bản cải thiện.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m28","display":"28","part":"Phần 1","type":"mcq","question":"Mức cao nhất trong Bloom","options":[{"label":"A","text":"Understand"},{"label":"B","text":"Apply"},{"label":"C","text":"Analyze"},{"label":"D","text":"Create"}],"correct":"D","explanation":"Trong thang Bloom sửa đổi, Create là mức tư duy cao nhất.","topic":"Thinking Framework","source":"Đề cương ôn tập DS103"},{"id":"m29","display":"29","part":"Phần 1","type":"mcq","question":"SCAMPER thuộc nhóm nào?","options":[{"label":"A","text":"Ra quyết định"},{"label":"B","text":"Tư duy sáng tạo"},{"label":"C","text":"Quản lý thời gian"},{"label":"D","text":"Tối ưu hóa vận hành"}],"correct":"B","explanation":"SCAMPER là khung tư duy sáng tạo dùng để biến đổi và phát triển ý tưởng.","topic":"Thinking Framework","source":"Đề cương ôn tập DS103"},{"id":"m30","display":"30","part":"Phần 1","type":"mcq","question":"Chữ O trong SWOT:","options":[{"label":"A","text":"Obstacle"},{"label":"B","text":"Objective"},{"label":"C","text":"Opportunity"},{"label":"D","text":"Operation"}],"correct":"C","explanation":"Chữ O trong SWOT là Opportunities – cơ hội.","topic":"Thinking Framework","source":"Đề cương ôn tập DS103"},{"id":"m31","display":"31","part":"Phần 1","type":"mcq","question":"Lợi ích của GenAI trong giáo dục:","options":[{"label":"A","text":"Cá nhân hóa bài học"},{"label":"B","text":"Thay thế giảng viên"},{"label":"C","text":"Xử lý đồ thị"},{"label":"D","text":"Chấm điểm 100% chính xác"}],"correct":"A","explanation":"Cá nhân hóa bài học là một lợi ích nổi bật của GenAI trong giáo dục.","topic":"AI trong giáo dục & trách nhiệm","source":"Đề cương ôn tập DS103"},{"id":"m32","display":"32","part":"Phần 1","type":"mcq","question":"Thành tố mô tả output của Prompt:","options":[{"label":"A","text":"Role"},{"label":"B","text":"Task"},{"label":"C","text":"Format"},{"label":"D","text":"Style"}],"correct":"C","explanation":"Format quy định cấu trúc đầu ra như bảng, JSON, Markdown hoặc danh sách.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m33","display":"33","part":"Phần 1","type":"mcq","question":"“Đóng vai chuyên gia…” thuộc thành tố:","options":[{"label":"A","text":"Context"},{"label":"B","text":"Role"},{"label":"C","text":"Examples"},{"label":"D","text":"Constraints"}],"correct":"B","explanation":"“Đóng vai chuyên gia…” xác định Role của AI.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m34","display":"34","part":"Phần 1","type":"mcq","question":"LLM hoạt động dựa trên:","options":[{"label":"A","text":"Trả lời đúng sai"},{"label":"B","text":"Dự đoán token tiếp theo"},{"label":"C","text":"Tính ma trận nghịch đảo"},{"label":"D","text":"Giới hạn độ dài văn bản"}],"correct":"B","explanation":"LLM chủ yếu học cách dự đoán token tiếp theo dựa trên ngữ cảnh đã có.","topic":"Nền tảng GenAI & LLM","source":"Đề cương ôn tập DS103"},{"id":"m35","display":"35","part":"Phần 1","type":"mcq","question":"Prompt tốt giúp:","options":[{"label":"A","text":"Tăng tốc GPU"},{"label":"B","text":"Giảm số neuron"},{"label":"C","text":"Tăng chất lượng output"},{"label":"D","text":"Giảm tham số mô hình"}],"correct":"C","explanation":"Prompt rõ ràng và đầy đủ giúp đầu ra đúng mục tiêu và có chất lượng cao hơn.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m36","display":"36","part":"Phần 1","type":"mcq","question":"Thành tố Context (Thông tin nền) trong Prompt Engineering dùng để làm gì ?","options":[{"label":"A","text":"Gán danh tính chuyên môn"},{"label":"B","text":"Yêu cầu AI trình bày kết quả dưới dạng cấu trúc nhất định"},{"label":"C","text":"Cung cấp dữ liệu, bối cảnh, hoặc ví dụ mẫu để AI hiểu rõ phạm vi"},{"label":"D","text":"Xác định hành động chính mà AI cần thực hiện"}],"correct":"C","explanation":"Context cung cấp dữ liệu, bối cảnh hoặc ví dụ để giới hạn và làm rõ nhiệm vụ.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m37","display":"37","part":"Phần 1","type":"mcq","question":"Trong quy trình Design Thinking (Tư duy thiết kế), bước nào diễn ra ngay trước bước Define (Định nghĩa)?","options":[{"label":"A","text":"Ideate (Sáng tạo ý tưởng)."},{"label":"B","text":"Prototype (Phát thảo)."},{"label":"C","text":"Test (Thử nghiệm)."},{"label":"D","text":"Empathize (Thấu cảm)."}],"correct":"D","explanation":"Thứ tự Design Thinking thường là Empathize → Define → Ideate → Prototype → Test.","topic":"Thinking Framework","source":"Đề cương ôn tập DS103"},{"id":"m38","display":"38","part":"Phần 1","type":"mcq","question":"Kỹ thuật Prompt Chaining (Chuỗi prompt) được sử dụng chủ yếu với mục đích gì?","options":[{"label":"A","text":"Yêu cầu AI tạo nhiều đáp án độc lập và chọn ra điểm chung nhất."},{"label":"B","text":"Chia nhỏ nhiệm vụ phức tạp thành chuỗi các prompt liên tiếp để đảm bảo tính hệ thống."},{"label":"C","text":"Không cung cấp ví dụ mẫu nào cho AI."},{"label":"D","text":"Yêu cầu AI tự đánh giá lại chính kết quả của mình để cải thiện."}],"correct":"B","explanation":"Prompt Chaining dùng chuỗi Prompt để xử lý từng phần của một nhiệm vụ phức tạp có hệ thống.","topic":"Prompt Engineering","source":"Đề cương ôn tập DS103"},{"id":"m39","display":"39","part":"Phần 1","type":"mcq","question":"Trong khung tư duy sáng tạo SCAMPER, chữ cái P đại diện cho hành động nào?","options":[{"label":"A","text":"Prototype (Nguyên mẫu)."},{"label":"B","text":"Put to another use (Ứng dụng khác)."},{"label":"C","text":"Paraphrase (Diễn giải)."},{"label":"D","text":"Plan (Lập kế hoạch)."}],"correct":"B","explanation":"P trong SCAMPER là Put to another use – đưa vào một cách sử dụng khác.","topic":"Thinking Framework","source":"Đề cương ôn tập DS103"},{"id":"m40","display":"40","part":"Phần 1","type":"mcq","question":"Nếu bạn muốn AI thực hiện tác vụ ở mức độ tư duy Evaluate (Đánh giá) theo Thang bậc Bloom, bạn nên dùng động từ nào trong Prompt?","options":[{"label":"A","text":"Summarize (Tóm tắt)."},{"label":"B","text":"Design (Thiết kế)."},{"label":"C","text":"Compare (So sánh)."},{"label":"D","text":"Critique (Phản biện)."}],"correct":"D","explanation":"Critique là động từ phù hợp với mức Evaluate vì yêu cầu đánh giá và đưa ra nhận xét có căn cứ.","topic":"Thinking Framework","source":"Đề cương ôn tập DS103"},{"id":"s1","display":"1","part":"Phần 2","type":"short","question":"AI sinh ra Output: “Việt Nam có 100 tỉnh thành”. Đây là hiện tượng gì của Generative AI? Hãy giải thích hiện tượng đó.","answer":"Đây là Hallucination (ảo giác AI). AI tạo ra thông tin nghe có vẻ đúng nhưng thực tế sai. Ví dụ: Việt Nam hiện không có 100 tỉnh, thành.","keywords":["Hallucination","thông tin sai","trình bày như thật"],"topic":"Trả lời ngắn","source":"Đáp án người dùng cung cấp"},{"id":"s2","display":"2","part":"Phần 2","type":"short","question":"Mô hình I–P–O trong Generative AI gồm những bước nào?","answer":"Input: Prompt của người dùng.\nProcessing: AI xử lý, phân tích Prompt.\nOutput: Kết quả AI trả về.","keywords":["Input","Processing","Output"],"topic":"Trả lời ngắn","source":"Đáp án người dùng cung cấp"},{"id":"s3","display":"3","part":"Phần 2","type":"short","question":"Khái niệm Generative AI.","answer":"Generative AI là trí tuệ nhân tạo có khả năng tạo ra nội dung mới như văn bản, hình ảnh, âm thanh, video hoặc mã nguồn dựa trên dữ liệu đã được huấn luyện.","keywords":["tạo nội dung mới","văn bản","hình ảnh","âm thanh/video/mã nguồn"],"topic":"Trả lời ngắn","source":"Đáp án người dùng cung cấp"},{"id":"s4","display":"4","part":"Phần 2","type":"short","question":"Ba đặc điểm nổi bật của Generative AI.","answer":"Tạo ra nội dung mới.\nHiểu và xử lý ngôn ngữ tự nhiên.\nHọc từ lượng dữ liệu rất lớn.","keywords":["nội dung mới","ngôn ngữ tự nhiên","dữ liệu lớn"],"topic":"Trả lời ngắn","source":"Đáp án người dùng cung cấp"},{"id":"s5","display":"5","part":"Phần 2","type":"short","question":"Giải thích nguyên lý Garbage In, Garbage Out (GIGO).","answer":"Nếu dữ liệu hoặc Prompt đầu vào kém chất lượng thì kết quả AI tạo ra cũng sẽ kém hoặc sai.","keywords":["đầu vào kém","đầu ra kém hoặc sai"],"topic":"Trả lời ngắn","source":"Đáp án người dùng cung cấp"},{"id":"s6","display":"6","part":"Phần 2","type":"short","question":"Lợi ích lớn nhất của GenAI trong giáo dục là gì?","answer":"Cá nhân hóa việc học, hỗ trợ học tập và tăng hiệu quả tự học.","keywords":["cá nhân hóa","hỗ trợ học tập","tự học"],"topic":"Trả lời ngắn","source":"Đáp án người dùng cung cấp"},{"id":"s7","display":"7","part":"Phần 2","type":"short","question":"Hallucination trong Generative AI là gì? Nêu một ví dụ minh họa.","answer":"Hallucination là hiện tượng AI tạo ra thông tin không chính xác nhưng trình bày như sự thật.\nVí dụ: AI nói “Việt Nam có 100 tỉnh thành”.","keywords":["thông tin không chính xác","như sự thật","ví dụ"],"topic":"Trả lời ngắn","source":"Đáp án người dùng cung cấp"},{"id":"s8","display":"8","part":"Phần 2","type":"short","question":"Vì sao người dùng thường cần tinh chỉnh Prompt khi làm việc với Generative AI? Việc điều chỉnh Prompt mang lại những lợi ích gì?","answer":"Để AI hiểu đúng yêu cầu và tạo kết quả chính xác hơn.\nLợi ích: tăng độ chính xác, giảm Hallucination và tiết kiệm thời gian chỉnh sửa.","keywords":["hiểu đúng yêu cầu","tăng chính xác","giảm Hallucination","tiết kiệm chỉnh sửa"],"topic":"Trả lời ngắn","source":"Đáp án người dùng cung cấp"},{"id":"s9","display":"9","part":"Phần 2","type":"short","question":"Nêu ít nhất ba tiêu chí mà người học cần xem xét trước khi sử dụng một câu trả lời do AI tạo ra.","answer":"Độ chính xác.\nNguồn thông tin đáng tin cậy.\nTính phù hợp với yêu cầu.","keywords":["độ chính xác","nguồn đáng tin","phù hợp yêu cầu"],"topic":"Trả lời ngắn","source":"Đáp án người dùng cung cấp"},{"id":"s10","display":"10","part":"Phần 2","type":"short","question":"Structured Output là gì? Nêu một vài ví dụ về dạng chuẩn mà AI có thể trả lời.","answer":"Là kết quả được trình bày theo định dạng cố định.\nVí dụ: bảng, JSON, Markdown hoặc danh sách Bullet.","keywords":["định dạng cố định","bảng","JSON","Markdown/Bullet"],"topic":"Trả lời ngắn","source":"Đáp án người dùng cung cấp"},{"id":"s11","display":"11","part":"Phần 2","type":"short","question":"Nêu tên và mô tả ngắn gọn ít nhất ba công cụ AI có thể hỗ trợ sinh viên trong học tập.","answer":"ChatGPT: giải thích kiến thức, viết và chỉnh sửa nội dung.\nGamma AI: tạo slide tự động.\nPerplexity AI: tìm kiếm thông tin kèm nguồn.\nCó thể thay Gamma bằng Canva AI hoặc Notion AI.","keywords":["ChatGPT","Gamma AI","Perplexity AI"],"topic":"Trả lời ngắn","source":"Đáp án người dùng cung cấp"},{"id":"s12","display":"12","part":"Phần 2","type":"short","question":"Thinking Framework là gì? Trình bày ý nghĩa của việc sử dụng Thinking Framework khi làm việc với AI.","answer":"Là khung tư duy giúp AI và người dùng giải quyết vấn đề có hệ thống.\nÝ nghĩa: suy nghĩ logic, tạo ý tưởng hiệu quả và phân tích đầy đủ vấn đề.","keywords":["khung tư duy","có hệ thống","logic","ý tưởng","phân tích đầy đủ"],"topic":"Trả lời ngắn","source":"Đáp án người dùng cung cấp"},{"id":"e1a","display":"1a","question":"Phân tích những lợi ích và rủi ro khi sinh viên sử dụng Generative AI trong học tập đại học. Theo anh/chị, Mindset hợp tác đúng với Generative AI là gì?","outline":"Lợi ích:\n• Cá nhân hóa giải thích và bài tập.\n• Hỗ trợ tìm ý, tóm tắt, phản hồi và tiết kiệm thời gian.\n• Tăng khả năng tiếp cận tài liệu và hỗ trợ tự học.\n\nRủi ro:\n• Hallucination, thiên lệch và thông tin lỗi thời.\n• Phụ thuộc AI, giảm tư duy độc lập.\n• Đạo văn, vi phạm quy định học thuật và rò rỉ dữ liệu cá nhân.\n\nMindset đúng:\n• Xem AI là “trợ lý/co-pilot”, không phải người làm thay.\n• Người học chịu trách nhiệm cuối cùng: phải kiểm chứng, chỉnh sửa, trích dẫn và bảo vệ dữ liệu.","part":"Phần 3","type":"essay","topic":"Tự luận","source":"Gợi ý ôn tập do AI biên soạn"},{"id":"e1b","display":"1b","question":"Viết một Prompt cho chủ đề “Đề xuất các giải pháp nâng cao kỹ năng tự học của sinh viên trong thời đại AI” sử dụng một khung tư duy bất kỳ. Mô tả ngắn gọn khung tư duy đó và giải thích lý do lựa chọn.","outline":"Khung chọn: SWOT – phân tích Điểm mạnh, Điểm yếu, Cơ hội và Thách thức. Khung này phù hợp vì giúp nhìn vấn đề từ cả yếu tố nội tại và môi trường bên ngoài trước khi đề xuất giải pháp.\n\nPrompt mẫu:\n“Bạn là chuyên gia giáo dục đại học. Hãy dùng khung SWOT để phân tích kỹ năng tự học của sinh viên trong thời đại AI. Bối cảnh: sinh viên năm nhất còn yếu về quản lý thời gian, chọn nguồn và kiểm chứng nội dung AI. Trình bày kết quả dưới dạng bảng 4 ô SWOT, sau đó đề xuất 5 giải pháp cụ thể, khả thi; mỗi giải pháp gồm mục tiêu, cách thực hiện, công cụ AI có thể dùng, rủi ro và cách kiểm soát. Dùng tiếng Việt rõ ràng, khoảng 700 từ.”","part":"Phần 3","type":"essay","topic":"Tự luận","source":"Gợi ý ôn tập do AI biên soạn"},{"id":"e1c","display":"1c","question":"Một sinh viên sử dụng Generative AI để hỗ trợ hoàn thành bài tập môn học. Hãy đề xuất quy trình đánh giá, kiểm chứng và cải tiến kết quả do AI tạo ra trước khi nộp bài.","outline":"1. Đọc kỹ đề và tiêu chí chấm; xác định phần nào được phép dùng AI.\n2. Viết Prompt có mục tiêu, bối cảnh, yêu cầu đầu ra và giới hạn rõ ràng.\n3. Kiểm tra mức độ bám đề, logic, cấu trúc và tính đầy đủ của Output.\n4. Fact-check các số liệu, khái niệm và trích dẫn bằng giáo trình hoặc nguồn đáng tin cậy.\n5. So sánh nhiều nguồn/công cụ khi thông tin quan trọng hoặc còn nghi ngờ.\n6. Loại bỏ thông tin sai; bổ sung dẫn chứng; viết lại bằng hiểu biết và giọng văn của bản thân.\n7. Kiểm tra đạo văn, trích dẫn, quy định sử dụng AI và dữ liệu riêng tư.\n8. Đọc soát lần cuối theo rubric trước khi nộp.","part":"Phần 3","type":"essay","topic":"Tự luận","source":"Gợi ý ôn tập do AI biên soạn"},{"id":"e2a","display":"2a","question":"Trình bày các thành tố cần có của một Prompt hiệu quả và vai trò của từng thành tố.","outline":"• Role: xác định vai trò hoặc chuyên môn của AI.\n• Task: nêu hành động/nhiệm vụ chính cần thực hiện.\n• Context: cung cấp dữ liệu nền, đối tượng, mục tiêu và phạm vi.\n• Product/Output: xác định sản phẩm cần tạo.\n• Format: quy định cấu trúc như bảng, đoạn văn, JSON hoặc Bullet.\n• Attribute/Style: quy định giọng văn, mức độ chi tiết, ngôn ngữ.\n• Constraints: giới hạn độ dài, nguồn, điều cấm hoặc tiêu chí bắt buộc.\n• Examples (khi cần): cho mẫu để AI hiểu cách trả lời mong muốn.","part":"Phần 3","type":"essay","topic":"Tự luận","source":"Gợi ý ôn tập do AI biên soạn"},{"id":"e2b","display":"2b","question":"Cho Prompt “Hãy giải thích AI.” Viết lại thành Prompt hoàn chỉnh để AI giải thích AI cho sinh viên năm nhất.","outline":"“Bạn là giảng viên nhập môn trí tuệ nhân tạo. Hãy giải thích khái niệm AI cho sinh viên năm nhất chưa có nền tảng công nghệ. Nội dung cần gồm: định nghĩa đơn giản, cách AI hoạt động ở mức khái quát, ba ứng dụng gần gũi, hai lợi ích, hai rủi ro và một ví dụ về Generative AI. Trình bày bằng tiếng Việt dễ hiểu, dùng tiêu đề và Bullet, giải thích thuật ngữ khó, không quá 500 từ và kết thúc bằng ba câu hỏi tự kiểm tra.”","part":"Phần 3","type":"essay","topic":"Tự luận","source":"Gợi ý ôn tập do AI biên soạn"}]</script>
<script>
const QUESTIONS=JSON.parse(document.getElementById('question-data').textContent);
const KEY='ds103_quiz_v1';
const byId=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).replace(/\n/g,'<br>');
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const state={progress:saved.progress||{},filter:saved.filter||'all',topic:saved.topic||'all',search:'',currentId:saved.currentId||'m1',showAnswers:false,exam:null};
let timer=null;
function save(){localStorage.setItem(KEY,JSON.stringify({progress:state.progress,filter:state.filter,topic:state.topic,currentId:state.currentId}));}
function p(q){return state.progress[q.id]||(state.progress[q.id]={});}
function statusDone(q){const x=p(q);return q.type==='mcq'?['correct','wrong'].includes(x.status):['learned','unlearned','drafted'].includes(x.status);}
function statusGood(q){const x=p(q);return q.type==='mcq'?x.status==='correct':['learned','drafted'].includes(x.status);}
function visible(){
  let arr=QUESTIONS;
  if(state.exam?.active) arr=state.exam.ids.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
  else{
    if(state.filter==='mcq')arr=arr.filter(q=>q.type==='mcq');
    if(state.filter==='short')arr=arr.filter(q=>q.type==='short');
    if(state.filter==='essay')arr=arr.filter(q=>q.type==='essay');
    if(state.filter==='wrong')arr=arr.filter(q=>p(q).status==='wrong'||p(q).status==='unlearned'||(!statusDone(q)&&q.type!=='mcq'));
    if(state.filter==='learned')arr=arr.filter(statusGood);
    if(state.filter==='starred')arr=arr.filter(q=>p(q).star);
    if(state.topic!=='all')arr=arr.filter(q=>q.topic===state.topic);
    const s=state.search.trim().toLowerCase();if(s)arr=arr.filter(q=>(q.question+' '+q.topic+' '+(q.answer||'')+' '+(q.outline||'')).toLowerCase().includes(s));
  }
  return arr;
}
function current(){let q=QUESTIONS.find(q=>q.id===state.currentId);const arr=visible();if(!q||!arr.some(x=>x.id===q.id)){q=arr[0];if(q)state.currentId=q.id;}return q;}
function setCurrent(id){state.currentId=id;save();renderAll();window.scrollTo({top:0,behavior:'smooth'});}
function setupTopics(){const topics=[...new Set(QUESTIONS.map(q=>q.topic))];byId('topic').innerHTML='<option value="all">Tất cả chủ đề</option>'+topics.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');byId('topic').value=state.topic;byId('filter').value=state.filter;}
function renderStats(){
  const done=QUESTIONS.filter(statusDone).length, good=QUESTIONS.filter(statusGood).length, pct=Math.round(done/QUESTIONS.length*100);
  byId('score').textContent=good;byId('answered').textContent=`${done}/${QUESTIONS.length}`;byId('percent').textContent=pct+'%';byId('bar').style.width=pct+'%';
  const q=current();byId('currentNum').textContent=q?q.display:'–';
}
function renderNav(){
  const groups=[['Phần 1',QUESTIONS.filter(q=>q.part==='Phần 1')],['Phần 2',QUESTIONS.filter(q=>q.part==='Phần 2')],['Phần 3',QUESTIONS.filter(q=>q.part==='Phần 3')]];
  const visibleIds=new Set(visible().map(q=>q.id));
  byId('nav').innerHTML=groups.map(([name,arr])=>`<div class="partTitle">${name}</div><div class="qgrid">${arr.map(q=>{const x=p(q);let cls='qbtn';if(q.id===state.currentId)cls+=' active';else if(x.status==='correct')cls+=' good';else if(x.status==='wrong'||x.status==='unlearned')cls+=' bad';else if(x.status==='learned'||x.status==='drafted')cls+=' learned';if(q.type==='essay')cls+=' essay';if(x.star)cls+=' star';const hidden=!visibleIds.has(q.id)&&!state.exam?.active;return `<button class="${cls}" data-go="${q.id}" ${hidden?'style="opacity:.28"':''}>${esc(q.display)}</button>`}).join('')}</div>`).join('');
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setCurrent(b.dataset.go));
}
function renderAnswerMap(){
  const box=byId('answerMap');box.classList.toggle('show',state.showAnswers&&!state.exam?.active);byId('toggleAnswers').classList.toggle('answerOn',state.showAnswers);byId('toggleAnswers').textContent=state.showAnswers?'Ẩn đáp án đúng':'Bật đáp án đúng';
  if(!state.showAnswers||state.exam?.active){box.innerHTML='';return;}
  const mcq=QUESTIONS.filter(q=>q.type==='mcq');
  box.innerHTML=`<div class="answerMapHead"><b>Đáp án nhanh phần trắc nghiệm</b><span>Bấm để mở câu</span></div><div class="answerMapGrid">${mcq.map(q=>`<button class="ansChip" data-ans="${q.id}"><span>${q.display}</span><b>${q.correct}</b></button>`).join('')}</div>`;
  document.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>setCurrent(b.dataset.ans));
}
function renderExam(){
  const box=byId('examStatus');if(!state.exam?.active){box.classList.remove('show');box.innerHTML='';return;}
  const answered=state.exam.ids.filter(id=>p(QUESTIONS.find(q=>q.id===id)).selected).length;
  box.classList.add('show');box.innerHTML=`<span>📝 Thi thử ${state.exam.ids.length} câu · đã chọn ${answered}/${state.exam.ids.length}</span><span><b class="timer" id="timer">--:--</b> <button class="btn primary" id="submitExam">Nộp bài</button> <button class="btn" id="exitExam">Thoát</button></span>`;
  byId('submitExam').onclick=finishExam;byId('exitExam').onclick=exitExam;updateTimer();
}
function optionClass(q,o){const x=p(q);let c='option';if(x.selected===o.label)c+=' selected';if(!state.exam?.active&&(x.status||state.showAnswers)){if(o.label===q.correct)c+=' correct';else if(x.selected===o.label&&x.status==='wrong')c+=' wrong';}return c;}
function renderCard(){
  const q=current(),box=byId('card');if(!q){box.className='card';box.innerHTML='<div class="empty">Không có câu phù hợp với bộ lọc hiện tại.</div>';return;}
  box.className='card '+q.type;const x=p(q);
  let html=`<div class="head"><div><div class="qid">${q.part} · Câu ${esc(q.display)}</div><div class="muted">${esc(q.topic)}</div></div><div class="badges"><span class="tag ${q.type}">${q.type==='mcq'?'Trắc nghiệm':q.type==='short'?'Trả lời ngắn':'Tự luận'}</span>${x.star?'<span class="tag">⭐ Đã gắn sao</span>':''}</div></div><div class="qtext">${esc(q.question)}</div>`;
  if(q.type==='mcq'){
    html+=`<div class="options">${q.options.map(o=>`<button class="${optionClass(q,o)}" data-opt="${o.label}"><span class="letter">${o.label}</span><span class="otext">${esc(o.text)}</span></button>`).join('')}</div>`;
    if(state.exam?.active)html+=`<div class="feedback neutral"><b>Đang thi thử:</b> web chỉ ghi nhận lựa chọn, chưa hiện đúng/sai cho tới khi nộp.</div>`;
    else if(x.status){const ok=x.status==='correct';html+=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Đúng rồi':'Sai rồi'} · Đáp án đúng: ${q.correct}</b><div class="explain">${esc(q.explanation)}</div></div>`}
    else if(state.showAnswers)html+=`<div class="feedback good"><b>Đáp án đúng: ${q.correct}</b><div class="explain">${esc(q.explanation)}</div></div>`;
  }else if(q.type==='short'){
    html+=`<div class="studyTip"><b>Cách ôn hiệu quả:</b> tự nói hoặc nhập câu trả lời trước → xem từ khóa nếu bí → hiện đáp án mẫu → tự đánh dấu Đã thuộc/Chưa thuộc.</div><textarea id="draft" placeholder="Tự trả lời bằng lời của m trước khi xem đáp án...">${esc(x.draft||'')}</textarea><div class="subActions"><button class="ghost" id="hintBtn">${x.hint?'Ẩn từ khóa':'Gợi ý từ khóa'}</button><button class="violetBtn" id="revealBtn">${x.revealed?'Ẩn đáp án mẫu':'Hiện đáp án mẫu'}</button></div>`;
    if(x.hint)html+=`<div class="keywords">${q.keywords.map(k=>`<span class="kw">${esc(k)}</span>`).join('')}</div>`;
    if(x.revealed||state.showAnswers)html+=`<div class="answerBox"><div class="boxLabel">Đáp án mẫu</div><div class="answerMain">${fmt(q.answer)}</div><div class="keywords">${q.keywords.map(k=>`<span class="kw">✓ ${esc(k)}</span>`).join('')}</div></div>`;
  }else{
    html+=`<div class="studyTip"><b>Luyện tự luận:</b> lập dàn ý hoặc viết bài vào ô dưới. Nội dung được lưu tự động trên trình duyệt.</div><textarea id="draft" placeholder="Nhập dàn ý/bài làm của m tại đây...">${esc(x.draft||'')}</textarea><div class="subActions"><button class="violetBtn" id="revealBtn">${x.revealed?'Ẩn gợi ý dàn ý':'Hiện gợi ý dàn ý'}</button></div>`;
    if(x.revealed||state.showAnswers)html+=`<div class="outlineBox"><div class="boxLabel">Gợi ý tham khảo</div><div class="answerMain">${fmt(q.outline)}</div></div>`;
  }
  html+=`<div class="source">Nguồn: ${esc(q.source)}</div><div class="actions"><div class="actionGroup"><button class="ghost" id="prevBtn">← Câu trước</button><button class="ghost" id="nextBtn">Câu sau →</button><button class="ghost" id="redoBtn">↻ Làm lại</button><button class="ghost" id="starBtn">${x.star?'★ Bỏ sao':'☆ Gắn sao'}</button></div><div class="actionGroup">${q.type!=='mcq'?`<button class="goodBtn" id="knownBtn">${q.type==='essay'?'Đã lập dàn ý':'Đã thuộc'}</button><button class="badBtn" id="notKnownBtn">Cần ôn thêm</button>`:''}</div></div>`;
  box.innerHTML=html;
  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answerMCQ(q,b.dataset.opt));
  const draft=byId('draft');if(draft)draft.oninput=e=>{p(q).draft=e.target.value;save();};
  const hint=byId('hintBtn');if(hint)hint.onclick=()=>{p(q).hint=!p(q).hint;save();renderAll();};
  const reveal=byId('revealBtn');if(reveal)reveal.onclick=()=>{p(q).revealed=!p(q).revealed;save();renderAll();};
  byId('prevBtn').onclick=()=>move(-1);byId('nextBtn').onclick=()=>move(1);byId('redoBtn').onclick=()=>redo(q);byId('starBtn').onclick=()=>{p(q).star=!p(q).star;save();renderAll();};
  const known=byId('knownBtn');if(known)known.onclick=()=>{p(q).status=q.type==='essay'?'drafted':'learned';save();move(1);};
  const notKnown=byId('notKnownBtn');if(notKnown)notKnown.onclick=()=>{p(q).status='unlearned';save();renderAll();};
}
function answerMCQ(q,label){const x=p(q);x.selected=label;if(!state.exam?.active)x.status=label===q.correct?'correct':'wrong';save();if(state.exam?.active)move(1);else renderAll();}
function move(dir){const arr=visible();if(!arr.length)return;let i=arr.findIndex(q=>q.id===state.currentId);if(i<0)i=0;i=(i+dir+arr.length)%arr.length;state.currentId=arr[i].id;save();renderAll();window.scrollTo({top:0,behavior:'smooth'});}
function redo(q){const keep={star:p(q).star,draft:p(q).draft};state.progress[q.id]={};if(keep.star)state.progress[q.id].star=true;if(keep.draft)state.progress[q.id].draft=keep.draft;save();renderAll();}
function randomQ(){const arr=visible();if(!arr.length)return;state.currentId=arr[Math.floor(Math.random()*arr.length)].id;save();renderAll();}
function startExam(count){
  const pool=QUESTIONS.filter(q=>q.type==='mcq').sort(()=>Math.random()-.5).slice(0,count);pool.forEach(q=>{const x=p(q);delete x.selected;delete x.status;});state.exam={active:true,ids:pool.map(q=>q.id),end:Date.now()+count*60*1000};state.currentId=pool[0].id;state.showAnswers=false;save();clearInterval(timer);timer=setInterval(()=>{if(state.exam?.active&&Date.now()>=state.exam.end)finishExam();else updateTimer()},500);renderAll();
}
function finishExam(){if(!state.exam?.active)return;let correct=0;state.exam.ids.forEach(id=>{const q=QUESTIONS.find(x=>x.id===id),x=p(q);x.status=x.selected===q.correct?'correct':'wrong';if(x.status==='correct')correct++;});const total=state.exam.ids.length;state.exam=null;clearInterval(timer);save();renderAll();alert(`Kết quả thi thử: ${correct}/${total} câu đúng (${Math.round(correct/total*100)}%).`);}
function exitExam(){state.exam=null;clearInterval(timer);renderAll();}
function updateTimer(){const el=byId('timer');if(!el||!state.exam?.active)return;const sec=Math.max(0,Math.ceil((state.exam.end-Date.now())/1000));el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function renderAll(){renderStats();renderNav();renderAnswerMap();renderExam();renderCard();}
byId('filter').onchange=e=>{state.filter=e.target.value;state.exam=null;save();renderAll();};
byId('topic').onchange=e=>{state.topic=e.target.value;state.exam=null;save();renderAll();};
byId('search').oninput=e=>{state.search=e.target.value;state.exam=null;renderAll();};
byId('wrongQuick').onclick=()=>{state.filter='wrong';byId('filter').value='wrong';renderAll();};
byId('shortQuick').onclick=()=>{state.filter='short';byId('filter').value='short';renderAll();};
byId('starQuick').onclick=()=>{state.filter='starred';byId('filter').value='starred';renderAll();};
byId('toggleAnswers').onclick=()=>{if(state.exam?.active)return alert('Hãy nộp hoặc thoát thi thử trước.');state.showAnswers=!state.showAnswers;renderAll();};
byId('randomBtn').onclick=randomQ;byId('printBtn').onclick=()=>window.print();
byId('resetBtn').onclick=()=>{if(confirm('Xóa toàn bộ đáp án, tiến độ và bài nháp đã lưu?')){state.progress={};state.currentId='m1';state.exam=null;save();renderAll();}};
byId('clearStarsBtn').onclick=()=>{Object.values(state.progress).forEach(x=>delete x.star);if(state.filter==='starred'){state.filter='all';byId('filter').value='all';}save();renderAll();};
document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>startExam(Number(b.dataset.exam)));
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;const q=current();if(q?.type==='mcq'&&['a','b','c','d'].includes(e.key.toLowerCase()))answerMCQ(q,e.key.toUpperCase());if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);});
setupTopics();renderAll();
</script>
</body></html>
