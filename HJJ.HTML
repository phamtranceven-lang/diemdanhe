<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web hiệu ứng text chạy</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .text {
      position: absolute;
      font-size: 22px;
      font-weight: bold;
      color: #00ffcc;
      pointer-events: none;
      text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
      user-select: none;
    }
  </style>
</head>
<body>

<script>
const texts = [
  "🔥 CÓ CÁI LỒN 🔥",
  "💀 CÓ CON CẶC 💀",
  "⚡CON MẸ MÀY⚡",
  "😎 BIẾNNNNNNNN😎"
];

function createText() {
  const el = document.createElement("div");
  el.className = "text";
  el.innerText = texts[Math.floor(Math.random() * texts.length)];

  document.body.appendChild(el);

  let x = Math.random() * (window.innerWidth - 120);
  let y = Math.random() * (window.innerHeight - 40);
  let dx = (Math.random() - 0.5) * 6;
  let dy = (Math.random() - 0.5) * 6;

  if (dx === 0) dx = 2;
  if (dy === 0) dy = 2;

  function move() {
    x += dx;
    y += dy;

    const w = el.offsetWidth;
    const h = el.offsetHeight;

    if (x < 0 || x > window.innerWidth - w) dx *= -1;
    if (y < 0 || y > window.innerHeight - h) dy *= -1;

    el.style.left = x + "px";
    el.style.top = y + "px";

    requestAnimationFrame(move);
  }

  move();
}

for (let i = 0; i < 15; i++) {
  createText();
}
</script>

</body>
</html>
