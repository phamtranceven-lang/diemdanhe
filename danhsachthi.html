<!DOCTYPE html>
<html lang="vi">
<head>
  <meta name="theme-color" content="#0a2e7a">
  <link rel="icon" href="favicon-dtu.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cảnh báo truy cập</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #300000, #000);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .warning-box {
      max-width: 900px;
      padding: 35px 45px;
      text-align: center;
      border: 4px solid red;
      border-radius: 18px;
      background: rgba(255, 0, 0, 0.12);
      box-shadow: 0 0 25px red, 0 0 60px rgba(255, 0, 0, 0.8);
      animation: shake 0.35s infinite, glow 1s infinite alternate;
    }

    .warning-text {
      color: #ff1a1a;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.5;
      text-transform: uppercase;
      text-shadow:
        0 0 5px #fff,
        0 0 12px red,
        0 0 25px red;
    }

    .icon {
      font-size: 70px;
      margin-bottom: 20px;
      animation: blink 0.7s infinite;
    }

    @keyframes shake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-5px, 3px) rotate(-1deg); }
      40% { transform: translate(5px, -3px) rotate(1deg); }
      60% { transform: translate(-4px, 2px) rotate(0deg); }
      80% { transform: translate(4px, -2px) rotate(1deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes glow {
      from {
        box-shadow: 0 0 20px red, 0 0 50px rgba(255, 0, 0, 0.7);
      }
      to {
        box-shadow: 0 0 40px red, 0 0 100px rgba(255, 0, 0, 1);
      }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    @media (max-width: 600px) {
      .warning-box {
        width: 90%;
        padding: 25px 20px;
      }

      .warning-text {
        font-size: 22px;
      }

      .icon {
        font-size: 55px;
      }
    }
  </style>
</head>
<body>

  <div class="warning-box">
    <div class="icon">⚠️</div>
    <div class="warning-text">
      ADMIN PHÁT HIỆN CÓ VÀI NGƯỜI NGOÀI XÀI WEBSITE<br>
      NÊN BẠN HÃY NHẮN LẠI ZALO ĐỂ ADMIN CẤP ĐƯỜNG LINK KHÁC
    </div>
  </div>

</body>
</html>
